server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: rivaanshprep-backend

  datasource:
    url: jdbc:h2:file:./data/rivaanshprep_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:dev@rivaanshprep.local}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Security & JWT Configuration
app:
  jwt:
    # 256-bit+ secure base64/hex secret for HMAC-SHA256
    secret: 4e9c7f21a8b3d5e6f0123456789abcdef0123456789abcdef0123456789abcdef
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days

# Cloudflare R2 Object Storage
cloudflare:
  r2:
    base-url: ${R2_BASE_URL:}
    cookie-name: rp_refresh_token
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
